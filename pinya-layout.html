<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d6 Castell Pinya Assignment</title>
    <style>
        :root {
            --accent: #d9944a;
            --accent-hover: #e5a864;
            --bg-dark: #1a1a1a;
            --bg-card: #2a2a2a;
            --bg-card-hover: #333333;
            --text: #e0e0e0;
            --text-dim: #999999;
            --border: #444444;
            --success: #4caf50;
            --warning: #ff9800;
            --error: #f44336;
            --col: #6b7a8a;
            --rengla: var(--col);
            --plena: var(--col);
            --buida: var(--col);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
        }

        .app {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            grid-template-rows: 60px 1fr 40px;
            height: 100vh;
            gap: 0;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            background: var(--bg-card);
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: var(--bg-card-hover);
            color: var(--text);
        }

        .btn.secondary:hover {
            background: #404040;
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 20px;
        }

        .settings-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .settings-section {
            margin-bottom: 20px;
        }

        .settings-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .settings-section h3::before {
            content: '▶';
            font-size: 10px;
            transition: transform 0.2s;
        }

        .settings-section.expanded h3::before {
            transform: rotate(90deg);
        }

        .settings-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .settings-section.expanded .settings-content {
            max-height: 1000px;
        }

        .setting-row {
            margin-bottom: 10px;
        }

        .setting-row label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .setting-row input[type="range"] {
            width: 100%;
        }

        .setting-row input[type="number"] {
            width: 100%;
            padding: 6px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 12px;
        }

        .setting-row select {
            width: 100%;
            padding: 6px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-size: 12px;
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        /* Canvas */
        .canvas {
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #252525 0%, #1a1a1a 100%);
        }

        .canvas-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center;
            transition: transform 0.3s ease;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            max-height: 1000px;
        }

        /* Pinya Slots */
        .slot {
            position: absolute;
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            text-align: center;
            z-index: 10;
        }
        
        .slot.tronc {
            z-index: 5;
        }
        
        .slot.filled {
            z-index: 15;
        }

        .slot.filled {
            border: 2px solid var(--accent);
            background: var(--bg-card-hover);
        }

        .slot.tronc {
            border-color: #555;
            background: #1f1f1f;
            cursor: default;
            opacity: 0.5;
            font-size: 10px;
        }
        
        .slot:not(.tronc):hover {
            transform: scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.08);
        }

        .slot.dragging-over {
            border-color: var(--accent);
            background: rgba(217, 148, 74, 0.1);
            transform: scale(1.05);
        }

        .slot.drag-replace {
            border-color: var(--accent);
            border-style: solid;
            background: rgba(217, 148, 74, 0.08);
            transform: scale(1.03);
            box-shadow: 0 0 8px rgba(217, 148, 74, 0.5);
        }

        .slot.drag-invalid {
            border-color: var(--error);
            cursor: not-allowed;
        }

        .slot-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .slot-name {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .slot-height {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 10px;
            color: var(--text-dim);
        }

        .slot-indicators {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .indicator.height-good { background: var(--success); }
        .indicator.height-ok { background: var(--warning); }
        .indicator.height-bad { background: var(--error); }

        .indicator.expertise-primary { color: gold; }
        .indicator.expertise-secondary { color: silver; }
        .indicator.expertise-none { color: #666; }

        /* Column Colors */
        .slot.col-rengla { border-color: var(--rengla); }
        .slot.col-plena { border-color: var(--plena); }
        .slot.col-buida { border-color: var(--buida); }

        /* Pool Panel */
        .pool-panel {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .pool-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .pool-header h2 {
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pool-count {
            font-size: 12px;
            color: var(--text-dim);
            background: var(--bg-dark);
            padding: 4px 8px;
            border-radius: 12px;
        }

        .pool-search {
            width: 100%;
            padding: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .pool-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .pool-controls select {
            flex: 1;
            padding: 6px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 12px;
        }

        .pool-list {
            overflow-y: auto;
            padding: 10px;
            flex: 1;
        }

        .casteller-card {
            background: var(--bg-card-hover);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
        }

        .casteller-card:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .casteller-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .casteller-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .casteller-info {
            font-size: 11px;
            color: var(--text-dim);
            display: flex;
            gap: 8px;
        }

        .casteller-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Status Bar */
        .status-bar {
            grid-column: 1 / -1;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-item.valid { color: var(--success); }
        .status-item.warning { color: var(--warning); }
        .status-item.invalid { color: var(--error); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 60px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 12px 16px;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .tooltip.show {
            opacity: 1;
        }

        /* Zoom controls */
        .zoom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        /* Undo/Redo */
        .history-controls {
            display: flex;
            gap: 5px;
        }

        /* ============================================================ */
        /* POSITION LAYOUT — 3d6 Triangle Pinya (no rotations)         */
        /* Triangle: Buida upper-left, Plena upper-right, Rengla bottom */
        /* Each column stack: Terç → Segon → Agulla → [Cr] Baix [Cr] → Contrafort */
        /* ============================================================ */

        /* === RENGLA column (bottom center, x=50%) === */
        .slot.terc-rengla   { left: 50%; top: 44.5%; transform: translateX(-50%); width: 80px; height: 35px; }
        .slot.segon-rengla  { left: 50%; top: 49%;   transform: translateX(-50%); width: 80px; height: 35px; }
        /* crossa-rengla are now SVG crossa-wrappers (see below) */
        /* baix-rengla is now an SVG baix-wrapper (see below) */
        /* contrafort-rengla is now an SVG contrafort-wrapper (see below) */

        /* === BUIDA column (upper left, x=25%) === */
        .slot.terc-buida   { left: 25%; top: 7%;    transform: translateX(-50%); width: 80px; height: 35px; }
        .slot.segon-buida  { left: 25%; top: 11.5%; transform: translateX(-50%); width: 80px; height: 35px; }
        /* crossa-buida are now SVG crossa-wrappers (see below) */
        /* baix-buida is now an SVG baix-wrapper (see below) */
        /* contrafort-buida is now an SVG contrafort-wrapper (see below) */

        /* === PLENA column (upper right, x=75%) === */
        .slot.terc-plena   { left: 75%; top: 7%;    transform: translateX(-50%); width: 80px; height: 35px; }
        .slot.segon-plena  { left: 75%; top: 11.5%; transform: translateX(-50%); width: 80px; height: 35px; }
        /* crossa-plena are now SVG crossa-wrappers (see below) */
        /* baix-plena is now an SVG baix-wrapper (see below) */
        /* contrafort-plena is now an SVG contrafort-wrapper (see below) */

        /* === AGULLA — SVG triangles forming a bigger equilateral triangle (center) ===
           Big triangle: side=160px, height≈139px
           Vertices: D(top)=(80,0)  A(btm-left)=(0,139)  B(btm-right)=(160,139)
           Center C = centroid = (80, 92.7) — at 2/3 height from apex D
           Rengla = C·A·B  (bottom, w=160 h=46)  viewBox="0 0 160 47"
           Buida  = C·D·A  (upper-left, w=80 h=139)  viewBox="0 0 80 139"
           Plena  = C·D·B  (upper-right, w=80 h=139)  viewBox="0 0 80 139"   */

        .agulla-wrapper {
            position: absolute;
            cursor: pointer;
            z-index: 10;
        }
        .agulla-wrapper .agulla-triangle {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 2px var(--border));
            transition: filter 0.2s;
        }
        .agulla-wrapper:hover .agulla-triangle {
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12));
        }
        .agulla-wrapper.filled .agulla-triangle polygon {
            fill: var(--bg-card-hover);
        }
        .agulla-wrapper.filled .agulla-triangle {
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.08));
        }
        .agulla-wrapper.dragging-over .agulla-triangle polygon {
            stroke-dasharray: 6 3;
            stroke-width: 3;
        }
        .agulla-wrapper.drag-replace .agulla-triangle polygon {
            stroke: var(--accent);
            stroke-width: 3;
        }
        .agulla-wrapper.drag-replace .agulla-triangle {
            filter: drop-shadow(0 0 8px rgba(217, 148, 74, 0.5));
        }
        .agulla-triangle .slot-label {
            fill: var(--text-dim);
            font-size: 10px;
            pointer-events: none;
        }
        .agulla-triangle .slot-name {
            fill: var(--text);
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }
        .agulla-triangle .slot-height {
            fill: var(--text-dim);
            font-size: 9px;
            pointer-events: none;
        }
        .agulla-triangle .indicator-text {
            font-size: 10px;
            pointer-events: none;
        }

        /* Rengla — bottom triangle */
        .agulla-wrapper.agulla-rengla {
            left: calc(50% - 80px);
            top: 45%;
            width: 160px;
            height: 47px;
        }
        /* Buida — upper-left triangle */
        .agulla-wrapper.agulla-buida {
            left: calc(50% - 80px);
            top: calc(45% - 93px);
            width: 80px;
            height: 139px;
        }
        /* Plena — upper-right triangle */
        .agulla-wrapper.agulla-plena {
            left: 50%;
            top: calc(45% - 93px);
            width: 80px;
            height: 139px;
        }

        /* === BAIX — SVG rectangles touching the agulla outer edges ===
           Each rectangle is perpendicular to centroid C, touching one
           outer edge of the big equilateral triangle.
           Rectangle dimensions: 120px along edge × 55px depth outward.
           Coordinates computed from big-triangle geometry:
             D=(0,-93) A=(-80,46) B=(80,46) relative to C at (50%,45%)
           Rengla: horizontal rect below edge A→B
           Buida:  tilted rect outside edge D→A (upper-left)
           Plena:  tilted rect outside edge D→B (upper-right)          */

        .baix-wrapper {
            position: absolute;
            cursor: pointer;
            z-index: 9;
        }
        .baix-wrapper .baix-rect {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 2px var(--border));
            transition: filter 0.2s;
        }
        .baix-wrapper:hover .baix-rect {
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12));
        }
        .baix-wrapper.filled .baix-rect polygon {
            fill: var(--bg-card-hover);
        }
        .baix-wrapper.filled .baix-rect {
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.08));
        }
        .baix-wrapper.dragging-over .baix-rect polygon {
            stroke-dasharray: 6 3;
            stroke-width: 3;
        }
        .baix-wrapper.drag-replace .baix-rect polygon {
            stroke: var(--accent);
            stroke-width: 3;
        }
        .baix-wrapper.drag-replace .baix-rect {
            filter: drop-shadow(0 0 8px rgba(217, 148, 74, 0.5));
        }
        .baix-rect .slot-label {
            fill: var(--text-dim);
            font-size: 10px;
            pointer-events: none;
        }
        .baix-rect .slot-name {
            fill: var(--text);
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }
        .baix-rect .slot-height {
            fill: var(--text-dim);
            font-size: 9px;
            pointer-events: none;
        }
        .baix-rect .indicator-text {
            font-size: 10px;
            pointer-events: none;
        }

        /* Rengla — bottom rectangle (horizontal, below edge A→B) */
        .baix-wrapper.baix-rengla {
            left: calc(50% - 60px);
            top: calc(45% + 47px);
            width: 120px;
            height: 55px;
        }
        /* Buida — upper-left rectangle (tilted, outside edge D→A) */
        .baix-wrapper.baix-buida {
            left: calc(50% - 118px);
            top: calc(45% - 103px);
            width: 108px;
            height: 132px;
        }
        /* Plena — upper-right rectangle (tilted, outside edge D→B) */
        .baix-wrapper.baix-plena {
            left: calc(50% + 10px);
            top: calc(45% - 103px);
            width: 108px;
            height: 132px;
        }

        /* === CONTRAFORT — SVG rectangles behind baix (further from agulla) ===
           Same shape as baix, translated 55px further outward from centroid C.
           Contrafort is behind baix, opposite side from the agulla.
           Geometry: same edge-perpendicular parallelograms, offset by 55px.  */

        .contrafort-wrapper {
            position: absolute;
            cursor: pointer;
            z-index: 8;
        }
        .contrafort-wrapper .contrafort-rect {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 2px var(--border));
            transition: filter 0.2s;
        }
        .contrafort-wrapper:hover .contrafort-rect {
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.12));
        }
        .contrafort-wrapper.filled .contrafort-rect polygon {
            fill: var(--bg-card-hover);
        }
        .contrafort-wrapper.filled .contrafort-rect {
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.08));
        }
        .contrafort-wrapper.dragging-over .contrafort-rect polygon {
            stroke-dasharray: 6 3;
            stroke-width: 3;
        }
        .contrafort-wrapper.drag-replace .contrafort-rect polygon {
            stroke: var(--accent);
            stroke-width: 3;
        }
        .contrafort-wrapper.drag-replace .contrafort-rect {
            filter: drop-shadow(0 0 8px rgba(217, 148, 74, 0.5));
        }
        .contrafort-rect .slot-label {
            fill: var(--text-dim);
            font-size: 10px;
            pointer-events: none;
        }
        .contrafort-rect .slot-name {
            fill: var(--text);
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }
        .contrafort-rect .slot-height {
            fill: var(--text-dim);
            font-size: 9px;
            pointer-events: none;
        }
        .contrafort-rect .indicator-text {
            font-size: 10px;
            pointer-events: none;
        }

        /* Rengla — bottom rectangle (horizontal, below baix-rengla) */
        .contrafort-wrapper.contrafort-rengla {
            left: calc(50% - 60px);
            top: calc(45% + 102px);
            width: 120px;
            height: 55px;
        }
        /* Buida — upper-left rectangle (tilted, behind baix-buida) */

            width: 108px;
            height: 133px;

            position: absolute;
            cursor: pointer;
            z-index: 9;

        .crossa-wrapper .crossa-rect {
            display: block;
            overflow: visible;
            filter: drop-shadow(0 0 2px var(--border));

        .crossa-wrapper.filled .crossa-rect polygon {

        .crossa-wrapper.filled .crossa-rect {
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.08));

        .crossa-wrapper.dragging-over .crossa-rect polygon {
            stroke-dasharray: 6 3;
            stroke-width: 3;

        .crossa-wrapper.drag-replace .crossa-rect polygon {
            stroke: var(--accent);
            stroke-width: 3;

        .crossa-wrapper.drag-replace .crossa-rect {
            filter: drop-shadow(0 0 8px rgba(217, 148, 74, 0.5));

            left: calc(50% - 110px);
            top: calc(45% + 47px);
            width: 50px;
            height: 110px;
        }
        /* Rengla — right crossa (horizontal rect, right of baix+contrafort) */
        .crossa-wrapper.crossa-rengla-1 {
            left: calc(50% + 60px);
            top: calc(45% + 47px);
            width: 50px;
            height: 110px;
        }
        /* Buida — upper crossa (outward from upper short side) */
        .crossa-wrapper.crossa-buida-0 {
            left: calc(50% - 105px);
            top: calc(45% - 173px);
            width: 120px;
            height: 97px;

            stroke-width: 3;

        .mans-wrapper.drag-substitute .mans-rect {

        /* Mans drag action feedback — insert mode */
        .mans-wrapper.drag-insert .mans-rect polygon {
            stroke: var(--success);
            stroke-width: 3;
            stroke-dasharray: 8 4;
        }
        .mans-wrapper.drag-insert .mans-rect {
            filter: drop-shadow(0 0 8px rgba(76, 175, 80, 0.5));

        .mans-insert-line {

            background: var(--success);

            transition: opacity 0.15s;

        .mans-insert-line.visible {
            opacity: 1;
        }
        /* Mans drag action label */
        .mans-drag-label {
            position: absolute;
            top: -18px;
            left: 50%;

            z-index: 31;

            transition: opacity 0.15s;

        class AppState {
            constructor() {
                this.castellers = [];
                this.assignments = {
                    dosos: {},
                    baix: {},
                    segon: {},
                    terç: {},
                    crossa: {},
                    contrafort: {},
                    agulla: {},
                    mans: {},
                    daus: {},
                    laterals: {}
                };
                this.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
                this.history = [];
                this.historyIndex = -1;
                this.zoom = 1;
                this.draggedElement = null;
                this.draggedCasteller = null;
                this.dragSourcePosId = null;
            }

            loadSampleData() {
                this.castellers = JSON.parse(JSON.stringify(SAMPLE_DATA.castellers));
                this.assignments = JSON.parse(JSON.stringify(SAMPLE_DATA.initial_assignments));
                this.saveHistory('Initial load');
            }

            getCasteller(name) {
                return this.castellers.find(c => c.name === name);
            }

            getAssignedNames() {
                const names = new Set();
                for (const [pos, cols] of Object.entries(this.assignments)) {
                    for (const val of Object.values(cols)) {
                        if (Array.isArray(val)) {
                            if (val.length > 0 && Array.isArray(val[0])) {
                                // Queue position
                                val.forEach(depth => {
                                    if (depth[0]) names.add(depth[0]);
                                });
                            } else {
                                // Regular position
                                val.forEach(name => {
                                    if (name) names.add(name);
                                });
                            }
                        }
                    }
                }
                return names;
            }

            getUnassigned() {
                const assigned = this.getAssignedNames();
                return this.castellers.filter(c => !assigned.has(c.name));
            }

            assignToSlot(positionId, name) {
                const [posType, col, idx] = this.parsePositionId(positionId);
                
                // Remove from previous assignment if exists
                this.removeFromAssignments(name);

                if (['mans', 'daus', 'laterals'].includes(posType)) {
                    // Queue position
                    if (!this.assignments[posType][col]) {
                        this.assignments[posType][col] = [];
                    }
                    while (this.assignments[posType][col].length <= idx) {
                        this.assignments[posType][col].push([null]);
                    }
                    this.assignments[posType][col][idx] = [name];
                } else {
                    // Regular position
                    if (!this.assignments[posType][col]) {
                        this.assignments[posType][col] = [];
                    }
                    if (idx !== undefined) {
                        while (this.assignments[posType][col].length <= idx) {
                            this.assignments[posType][col].push(null);
                        }
                        this.assignments[posType][col][idx] = name;
                    } else {
                        this.assignments[posType][col] = [name];
                    }
                }
            }

            removeFromSlot(positionId) {
                const [posType, col, idx] = this.parsePositionId(positionId);
                
                if (['mans', 'daus', 'laterals'].includes(posType)) {
                    // Stack behavior: splice out and shift everyone behind forward
                    if (this.assignments[posType]?.[col] && idx < this.assignments[posType][col].length) {
                        this.assignments[posType][col].splice(idx, 1);
                    }
                } else {
                    if (this.assignments[posType][col]) {
                        if (idx !== undefined) {
                            this.assignments[posType][col][idx] = null;
                        } else {
                            this.assignments[posType][col] = [];
                        }
                    }
                }
            }

            removeFromAssignments(name) {
                for (const [posType, cols] of Object.entries(this.assignments)) {
                    for (const [col, val] of Object.entries(cols)) {
                        if (Array.isArray(val)) {
                            if (val.length > 0 && Array.isArray(val[0])) {
                                // Queue position — splice for stack shift (all queue types)
                                for (let i = val.length - 1; i >= 0; i--) {
                                    if (val[i][0] === name) {
                                        val.splice(i, 1);
                                    }
                                }
                            } else {
                                // Regular position
                                for (let i = 0; i < val.length; i++) {
                                    if (val[i] === name) {
                                        val[i] = null;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            getSlotContent(positionId) {
                const [posType, col, idx] = this.parsePositionId(positionId);
                
                if (!this.assignments[posType]) return null;
                
                if (['mans', 'daus', 'laterals'].includes(posType)) {
                    if (this.assignments[posType][col] && this.assignments[posType][col][idx]) {
                        return this.assignments[posType][col][idx][0];
                    }
                } else {
                    if (this.assignments[posType][col]) {
                        if (idx !== undefined) {
                            return this.assignments[posType][col][idx];
                        } else {
                            return this.assignments[posType][col][0];
                        }
                    }
                }
                return null;
            }

            parsePositionId(id) {
                // Format: "posType-col-idx" or "posType-col"
                const parts = id.split('-');
                let posType = parts[0];
                // Map ASCII IDs to actual assignment keys (CSS class names can't use cedilla)
                const TYPE_MAP = { 'terc': 'terç' };
                posType = TYPE_MAP[posType] || posType;
                const col = parts.slice(1, -1).join('-') || parts[1];
                const idx = parts.length > 2 && !isNaN(parts[parts.length - 1]) ? parseInt(parts[parts.length - 1]) : undefined;
                return [posType, col, idx];
            }

            addCasteller(casteller) {
                if (this.castellers.find(c => c.name === casteller.name)) {
                    throw new Error('Casteller with this name already exists');
                }
                this.castellers.push(casteller);
                this.saveHistory(`Added ${casteller.name}`);
            }

            removeCasteller(name) {
                this.removeFromAssignments(name);
                this.castellers = this.castellers.filter(c => c.name !== name);
                this.saveHistory(`Removed ${name}`);
            }

            updateCasteller(oldName, newCasteller) {
                const idx = this.castellers.findIndex(c => c.name === oldName);
                if (idx === -1) return;
                
                if (oldName !== newCasteller.name) {
                    // Name changed - update assignments
                    for (const [posType, cols] of Object.entries(this.assignments)) {
                        for (const [col, val] of Object.entries(cols)) {
                            if (Array.isArray(val)) {
                                if (val.length > 0 && Array.isArray(val[0])) {
                                    // Queue
                                    for (let i = 0; i < val.length; i++) {
                                        if (val[i][0] === oldName) {
                                            val[i] = [newCasteller.name];
                                        }
                                    }
                                } else {
                                    // Regular
                                    for (let i = 0; i < val.length; i++) {
                                        if (val[i] === oldName) {
                                            val[i] = newCasteller.name;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                
                this.castellers[idx] = newCasteller;
                this.saveHistory(`Updated ${newCasteller.name}`);
            }

            saveHistory(action) {
                // Trim future history if we're not at the end
                this.history = this.history.slice(0, this.historyIndex + 1);
                
                this.history.push({
                    action,
                    state: {
                        castellers: JSON.parse(JSON.stringify(this.castellers)),
                        assignments: JSON.parse(JSON.stringify(this.assignments))
                    }
                });
                
                this.historyIndex++;
                
                // Limit history to 50 entries
                if (this.history.length > 50) {
                    this.history.shift();
                    this.historyIndex--;
                }
                
                updateHistoryButtons();
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    const snapshot = this.history[this.historyIndex];
                    this.castellers = JSON.parse(JSON.stringify(snapshot.state.castellers));
                    this.assignments = JSON.parse(JSON.stringify(snapshot.state.assignments));
                    return true;
                }
                return false;
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    const snapshot = this.history[this.historyIndex];
                    this.castellers = JSON.parse(JSON.stringify(snapshot.state.castellers));
                    this.assignments = JSON.parse(JSON.stringify(snapshot.state.assignments));
                    return true;
                }
                return false;
            }

            exportJSON() {
                const assigned = this.getAssignedNames();
                const unassigned = this.castellers.filter(c => !assigned.has(c.name));

                return {
                    assignments: this.assignments,
                    summary: {
                        total_assigned: assigned.size,
                        unassigned: unassigned
                    },
                    configuration: {
                        columns: ['Rengla', 'Plena', 'Buida'],
                        tronc_positions: ['baix', 'segon', 'terç'],
                        optimization_method: this.config.optimization.method,
                        use_weight: this.config.optimization.use_weight
                    }
                };
            }

            importJSON(data) {
                if (data.castellers) {
                    this.castellers = data.castellers;
                }
                if (data.initial_assignments || data.assignments) {
                    this.assignments = data.initial_assignments || data.assignments;
                }
                if (data.configuration) {
                    if (data.configuration.optimization_method) {
                        this.config.optimization.method = data.configuration.optimization_method;
                    }
                    if (data.configuration.use_weight !== undefined) {
                        this.config.optimization.use_weight = data.configuration.use_weight;
                    }
                }
                this.saveHistory('Imported data');
            }
        }

        function rebuildMatrixQueues() {
            const container = document.getElementById('canvasInner');

            // Remove old matrix slot wrappers, legacy containers, and old insert line
            container.querySelectorAll('.matrix-slot-wrapper').forEach(el => el.remove());
            container.querySelectorAll('.matrix-container').forEach(el => el.remove());
            const oldMatrixLine = container.querySelector('#matrixInsertLine');
            if (oldMatrixLine) oldMatrixLine.remove();

            MATRIX_CONFIGS.forEach(cfg => {
                const geo = MATRIX_GEOMETRY[cfg.id];
                if (!geo) return;

                // Determine max depth across all 3 columns
                const depths = cfg.columns.map(col => {
                    const existing = state.assignments[col.queueType]?.[col.queueId] || [];
                    return existing.length;
                });
                const maxDepth = Math.max(...depths, 0) + 1; // +1 for empty drop target row

                // Create SVG wrapper for each cell
                for (let d = 0; d < maxDepth; d++) {
                    cfg.columns.forEach((col, colIdx) => {
                        const wrapper = createMatrixSlotSVG(cfg, geo, col, colIdx, d);
                        container.appendChild(wrapper);
                        updateMatrixSlot(`${col.queueType}-${col.queueId}-${d}`);

                }
            });

            const matrixLine = document.createElement('div');

            // Compute cell center position (offset from 50%/45%)
            const colOffset = colIdx - 1; // -1, 0, +1 for the three columns
            const cx = geo.originX + colOffset * geo.colSpacing * geo.edgeX + depth * geo.depthSpacing * geo.outX;
            const cy = geo.originY + colOffset * geo.colSpacing * geo.edgeY + depth * geo.depthSpacing * geo.outY;

        /** Detect whether a drag over a matrix slot should substitute or insert.
         *  Projects cursor onto the outward direction of the matrix.
         *  - Center 50% → substitute (replace)
         *  - Leading 25% (toward center) → insert before
         *  - Trailing 25% (away from center) → insert after
         */
        function getMatrixDropAction(wrapper, e) {
            const depth = parseInt(wrapper.dataset.matrixDepth);
            const posId = wrapper.dataset.positionId;
            const existingName = state.getSlotContent(posId);

            // Empty slot → always substitute (fill)
            if (!existingName) return { action: 'substitute', insertIndex: null };

            const matrixId = wrapper.dataset.matrixId;
            const geo = MATRIX_GEOMETRY[matrixId];

            // Get cursor position relative to wrapper center
            const rect = wrapper.getBoundingClientRect();
            const cx = e.clientX - (rect.left + rect.width / 2);
            const cy = e.clientY - (rect.top + rect.height / 2);

            // Project cursor onto outward direction
            const proj = cx * geo.outX + cy * geo.outY;
            const halfDepth = geo.depthSpacing / 2;
            const normalized = proj / halfDepth;

            if (normalized < -0.4) return { action: 'insert', insertIndex: depth };
            if (normalized > 0.4)  return { action: 'insert', insertIndex: depth + 1 };
            return { action: 'substitute', insertIndex: null };
        }

        // ============================================================
        // MANS DROP-ACTION DETECTION & INSERT LINE
        // ============================================================

        /** Detect whether a drag over a mans slot should substitute or insert.
         *  Uses cursor position projected onto the queue direction:
         *  - Center 50% of slot → substitute (replace casteller)
         *  - Leading 25% (toward center) → insert before
         *  - Trailing 25% (away from center) → insert after
         */
        function getMansDropAction(wrapper, e) {
            const col = wrapper.dataset.mansCol;
            const depth = parseInt(wrapper.dataset.mansDepth);
            const geo = MANS_GEOMETRY[col];
            const posId = wrapper.dataset.positionId;
            const existingName = state.getSlotContent(posId);

            // Empty slot → always fill (substitute)
            if (!existingName) return { action: 'substitute', insertIndex: null };

            // Get cursor position relative to wrapper center
            const rect = wrapper.getBoundingClientRect();
            const cx = e.clientX - (rect.left + rect.width / 2);
            const cy = e.clientY - (rect.top + rect.height / 2);

            // Queue direction vector
            const dx = geo.dLeft, dy = geo.dTop;
            const len = Math.sqrt(dx * dx + dy * dy);

            // Project cursor offset onto queue direction (signed distance from center)
            const proj = (cx * dx + cy * dy) / len;

            // Compute half-extent of the slot polygon along queue direction
            const points = geo.points.split(/\s+/).map(p => {
                const [x, y] = p.split(',').map(Number);
                return { x: x - geo.w / 2, y: y - geo.h / 2 };
            });
            const projections = points.map(p => (p.x * dx + p.y * dy) / len);
            const halfExtent = Math.max(...projections.map(Math.abs));

            // Normalize: -1 = leading edge (toward center), +1 = trailing edge (outward)
            const normalized = proj / halfExtent;

            // Thresholds: center 50% = substitute, edges 25% each = insert
            if (normalized < -0.4) return { action: 'insert', insertIndex: depth };
            if (normalized > 0.4)  return { action: 'insert', insertIndex: depth + 1 };
            return { action: 'substitute', insertIndex: null };
        }

        function showInsertLine(col, insertIndex) {
            const line = document.getElementById('mansInsertLine');
            if (!line) return;

            const geo = MANS_GEOMETRY[col];

            if (col === 'Rengla') {
                // Horizontal line at the boundary between consecutive vertical slots
                const left = geo.baseLeft - 10;
                const top  = geo.baseTop + insertIndex * geo.dTop;
                line.style.left      = `calc(50% + ${left}px)`;
                line.style.top       = `calc(45% + ${top - 2}px)`;
                line.style.width     = `${geo.w + 20}px`;
                line.style.height    = '4px';
                line.style.transform = 'none';
            } else if (col === 'Buida') {
                // Angled line along the long side of the Buida parallelogram
                // Long side runs from (60,0)→(0,104): midpoint at (30, 52)
                const left = geo.baseLeft + insertIndex * geo.dLeft + 30;
                const top  = geo.baseTop  + insertIndex * geo.dTop  + 52;
                const edgeAngle = Math.atan2(104, -60) * 180 / Math.PI; // ≈120°
                line.style.left      = `calc(50% + ${left}px)`;
                line.style.top       = `calc(45% + ${top}px)`;
                line.style.width     = '130px';
                line.style.height    = '4px';
                line.style.transform = `translate(-50%, -50%) rotate(${edgeAngle}deg)`;
            } else { // Plena
                // Angled line along the long side of the Plena parallelogram
                // Long side runs from (48,0)→(108,104): midpoint at (78, 52)
                const left = geo.baseLeft + insertIndex * geo.dLeft + 78;
                const top  = geo.baseTop  + insertIndex * geo.dTop  + 52;
                const edgeAngle = Math.atan2(104, 60) * 180 / Math.PI; // ≈60°
                line.style.left      = `calc(50% + ${left}px)`;
                line.style.top       = `calc(45% + ${top}px)`;
                line.style.width     = '130px';
                line.style.height    = '4px';
                line.style.transform = `translate(-50%, -50%) rotate(${edgeAngle}deg)`;
            }

            line.classList.add('visible');
        }

        function hideInsertLine() {
            const line = document.getElementById('mansInsertLine');

        function showMatrixInsertLine(matrixId, queueId, queueType, colIdx, insertIndex) {
            const line = document.getElementById('matrixInsertLine');
            if (!line) return;

            const geo = MATRIX_GEOMETRY[matrixId];
            if (!geo) return;

            const colOffset = colIdx - 1;

            // Compute the boundary point between depth (insertIndex-1) and insertIndex
            // This is the center of the long edge between two consecutive depth cells
            const cx = geo.originX + colOffset * geo.colSpacing * geo.edgeX + insertIndex * geo.depthSpacing * geo.outX;
            const cy = geo.originY + colOffset * geo.colSpacing * geo.edgeY + insertIndex * geo.depthSpacing * geo.outY;

            // The insert line runs along the edge direction (the long side)
            const edgeAngle = Math.atan2(geo.edgeY, geo.edgeX) * 180 / Math.PI;

            // Length: match the long side of the cell shape
            const longSideLen = 130;

            line.style.left      = `calc(50% + ${cx}px)`;
            line.style.top       = `calc(45% + ${cy}px)`;
            line.style.width     = `${longSideLen}px`;
            line.style.height    = '4px';
            line.style.transform = `translate(-50%, -50%) rotate(${edgeAngle}deg)`;

            line.classList.add('visible');
        }

        // ============================================================
        // CROSSA OVERLAP RESOLUTION — perpendicular bisector clipping
        // ============================================================

        function resolveCrossaOverlaps() {
            const wrappers = Array.from(document.querySelectorAll('.crossa-wrapper'));

            // Reset all polygons to their original points
            wrappers.forEach(w => {
                const poly = w.querySelector('.crossa-rect polygon');
                if (poly && poly.dataset.originalPoints) {
                    poly.setAttribute('points', poly.dataset.originalPoints);
                }
            });

            if (wrappers.length < 2) return;

            // Collect info: bounding rect in screen coords + SVG viewBox mapping
            const infos = wrappers.map(w => {
                const r = w.getBoundingClientRect();
                const svg = w.querySelector('.crossa-rect');
                const vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
                return {
                    el: w,
                    cx: r.left + r.width / 2,
                    cy: r.top + r.height / 2,
                    rect: r,
                    vb: { x: vb[0], y: vb[1], w: vb[2], h: vb[3] },
                    svg: svg
                };
            });

            // For each pair, check overlap and clip SVG polygons
            for (let i = 0; i < infos.length; i++) {
                for (let j = i + 1; j < infos.length; j++) {
                    const a = infos[i], b = infos[j];
                    // AABB overlap test
                    if (a.rect.right <= b.rect.left || b.rect.right <= a.rect.left ||
                        a.rect.bottom <= b.rect.top || b.rect.bottom <= a.rect.top) {
                        continue;
                    }

                    // Perpendicular bisector in screen coords
                    const mx = (a.cx + b.cx) / 2;
                    const my = (a.cy + b.cy) / 2;
                    const nx = b.cx - a.cx;
                    const ny = b.cy - a.cy;

                    clipCrossaPolygon(a, nx, ny, mx, my, -1);
                    clipCrossaPolygon(b, nx, ny, mx, my, +1);
                }
            }
        }

        function screenToSVG(screenX, screenY, rect, vb) {
            // Convert screen coordinates to SVG viewBox coordinates
            return {
                x: vb.x + (screenX - rect.left) / rect.width * vb.w,
                y: vb.y + (screenY - rect.top) / rect.height * vb.h
            };
        }

        function svgToScreen(svgX, svgY, rect, vb) {
            // Convert SVG viewBox coordinates to screen coordinates
            return {
                x: rect.left + (svgX - vb.x) / vb.w * rect.width,
                y: rect.top + (svgY - vb.y) / vb.h * rect.height
            };
        }

        function clipCrossaPolygon(info, nx, ny, mx, my, sign) {
            const poly = info.svg.querySelector('polygon');
            if (!poly) return;

            // Parse current SVG polygon points
            const pointsStr = poly.getAttribute('points');
            const svgPoly = pointsStr.split(/\s+/).map(pair => {
                const [x, y] = pair.split(',').map(Number);
                return { x, y };
            }).filter(p => !isNaN(p.x) && !isNaN(p.y));

            if (svgPoly.length < 3) return;

            // Convert SVG polygon to screen coords, clip, convert back
            const screenPoly = svgPoly.map(p => svgToScreen(p.x, p.y, info.rect, info.vb));

            // Signed distance from bisector in screen space
            function dist(p) { return nx * (p.x - mx) + ny * (p.y - my); }
            function keeps(d) { return sign < 0 ? d <= 0.5 : d >= -0.5; }

            // Sutherland-Hodgman clip
            const clipped = [];
            for (let i = 0; i < screenPoly.length; i++) {
                const curr = screenPoly[i];
                const next = screenPoly[(i + 1) % screenPoly.length];
                const dCurr = dist(curr);
                const dNext = dist(next);
                const currIn = keeps(dCurr);
                const nextIn = keeps(dNext);

                if (currIn) clipped.push(curr);
                if (currIn !== nextIn) {
                    const t = dCurr / (dCurr - dNext);
                    clipped.push({
                        x: curr.x + t * (next.x - curr.x),
                        y: curr.y + t * (next.y - curr.y)
                    });
                }
            }

            if (clipped.length < 3) return;

            // Check if nothing was actually clipped
            if (clipped.length === screenPoly.length && screenPoly.every(p => keeps(dist(p)))) {
                return;
            }

            // Convert back to SVG viewBox coordinates and update polygon
            const newPoints = clipped.map(p => {
                const sv = screenToSVG(p.x, p.y, info.rect, info.vb);
                return `${sv.x.toFixed(1)},${sv.y.toFixed(1)}`;
            }).join(' ');

            poly.setAttribute('points', newPoints);
        }

        function getHeightIndicator(positionId, casteller) {
            const [posType, col, idx] = state.parsePositionId(positionId);
            
            if (posType === 'baix') return null; // No height requirement for baix

            const ratio = calculateHeightRatio(positionId, casteller);
            if (ratio === null) return null;

            const { min, max } = getHeightRatioRange(posType, idx);
            if (min === null || max === null) return null;

            const indicator = document.createElement('div');
            indicator.className = 'indicator';
            indicator.textContent = '●';
            indicator.title = `Height ratio: ${(ratio * 100).toFixed(1)}% (target: ${(min * 100).toFixed(0)}–${(max * 100).toFixed(0)}%)`;

            if (ratio >= min && ratio <= max) {
                indicator.classList.add('height-good');
            } else if (ratio >= min * 0.95 && ratio <= max * 1.05) {
                indicator.classList.add('height-ok');
            } else {
                indicator.classList.add('height-bad');
            }

            return indicator;
        }

        function getExpertiseIndicator(positionId, casteller) {
            const [posType] = state.parsePositionId(positionId);
            
            const keywords = getPositionKeywords(posType);
            const pos1 = (casteller.position_1 || '').toLowerCase();
            const pos2 = (casteller.position_2 || '').toLowerCase();

            const indicator = document.createElement('div');
            indicator.className = 'indicator';

            let hasPrimary = false;
            let hasSecondary = false;

            keywords.forEach(kw => {
                if (pos1.includes(kw.toLowerCase())) hasPrimary = true;
                if (pos2.includes(kw.toLowerCase())) hasSecondary = true;
            });

            if (hasPrimary) {
                indicator.classList.add('expertise-primary');

                indicator.title = `Primary expertise: ${casteller.position_1}`;

        }

        function calculateHeightRatio(positionId, casteller) {
            const [posType, col, idx] = state.parsePositionId(positionId);
            const refHeight = getReferenceHeight(positionId);
            
            if (refHeight === null || refHeight === 0) return null;
            return casteller.height / refHeight;
        }

        function getReferenceHeight(positionId) {
            const [posType, col, idx] = state.parsePositionId(positionId);

            if (posType === 'crossa' || posType === 'contrafort') {
                // Reference: baix of same column
                const baixName = state.getSlotContent(`baix-${col}`);
                const baix = baixName ? state.getCasteller(baixName) : null;
                return baix ? baix.height : null;
            }

            if (posType === 'agulla') {
                // Reference: baix + segon of same column
                const baixName = state.getSlotContent(`baix-${col}`);
                const segonName = state.getSlotContent(`segon-${col}`);
                const baix = baixName ? state.getCasteller(baixName) : null;
                const segon = segonName ? state.getCasteller(segonName) : null;
                if (!baix || !segon) return null;
                return baix.height + segon.height;
            }

            if (posType === 'mans' || posType === 'laterals') {
                // For laterals, extract base column from queue ID (e.g. "Rengla-left" → "Rengla")
                const baseCol = posType === 'laterals' ? col.replace(/-(?:left|right)$/, '') : col;
                if (idx === 0) {
                    // Depth 1: Reference baix + segon of column
                    const baixName = state.getSlotContent(`baix-${baseCol}`);
                    const segonName = state.getSlotContent(`segon-${baseCol}`);
                    const baix = baixName ? state.getCasteller(baixName) : null;
                    const segon = segonName ? state.getCasteller(segonName) : null;
                    if (!baix || !segon) return null;
                    return baix.height + segon.height;
                } else {
                    // Depth N: Reference previous depth in same queue
                    const prevName = state.getSlotContent(`${posType}-${col}-${idx - 1}`);
                    const prev = prevName ? state.getCasteller(prevName) : null;
                    return prev ? prev.height : null;
                }
            }

            if (posType === 'daus') {
                if (idx === 0) {
                    // Depth 1: Average of both columns' baix + segon
                    const cols = col.split('↔');
                    const heights = [];
                    for (const c of cols) {
                        const normalCol = c === 'R' ? 'Rengla' : c === 'P' ? 'Plena' : 'Buida';
                        const baixName = state.getSlotContent(`baix-${normalCol}`);
                        const segonName = state.getSlotContent(`segon-${normalCol}`);
                        const baix = baixName ? state.getCasteller(baixName) : null;
                        const segon = segonName ? state.getCasteller(segonName) : null;
                        if (baix && segon) heights.push(baix.height + segon.height);
                    }
                    if (heights.length === 0) return null;
                    return heights.reduce((a, b) => a + b) / heights.length;
                } else {
                    // Depth N: Reference previous depth
                    const prevName = state.getSlotContent(`${posType}-${col}-${idx - 1}`);
                    const prev = prevName ? state.getCasteller(prevName) : null;
                    return prev ? prev.height : null;
                }
            }

            return null;
        }

        function getHeightRatioRange(posType, depth) {
            if (posType === 'crossa') {
                const c = state.config.positions.crossa;
                return { min: c.height_ratio_min, max: c.height_ratio_max };
            }
            if (posType === 'contrafort') {
                const c = state.config.positions.contrafort;
                return { min: c.height_ratio_min, max: c.height_ratio_max };
            }
            if (posType === 'agulla') {
                const c = state.config.positions.agulla;
                return { min: c.height_ratio_min, max: c.height_ratio_max };
            }
            if (['mans', 'daus', 'laterals'].includes(posType)) {
                const qConfig = state.config.queues[posType];
                if (depth === 0) {
                    return {
                        min: qConfig.height_ratio_min,
                        max: qConfig.height_ratio_max
                    };
                } else {
                    return {
                        min: qConfig.queue_height_ratio_min,
                        max: qConfig.queue_height_ratio_max
                    };
                }
            }
            return { min: null, max: null };
        }

        function getPositionKeywords(posType) {
            const keywords = {
                baix: ['Baix'],
                crossa: ['Crossa'],
                contrafort: ['Contrafort'],
                agulla: ['Agulla'],
                mans: ['Primeres'],
                daus: ['Dau/Vent', 'Dau', 'Vent'],
                laterals: ['Lateral']
            };
            return keywords[posType] || [];
        }

        // ============================================================================
        // POOL RENDERING
        // ============================================================================

        function updatePool() {
            const poolList = document.getElementById('poolList');
            const search = document.getElementById('poolSearch').value.toLowerCase();
            const sortBy = document.getElementById('poolSort').value;

            let unassigned = state.getUnassigned();

            // Filter
            if (search) {
                unassigned = unassigned.filter(c =>
                    c.name.toLowerCase().includes(search) ||
                    (c.position_1 || '').toLowerCase().includes(search) ||
                    (c.position_2 || '').toLowerCase().includes(search)
                );
            }

            // Sort
            unassigned.sort((a, b) => {
                if (sortBy === 'name') return a.name.localeCompare(b.name);
                if (sortBy === 'height') return b.height - a.height;
                if (sortBy === 'position') return (a.position_1 || '').localeCompare(b.position_1 || '');
                return 0;
            });

            poolList.innerHTML = '';
            unassigned.forEach(casteller => {
                const card = createCastellerCard(casteller);
                poolList.appendChild(card);
            });

            // Update count
            const poolCount = document.getElementById('poolCount');
            poolCount.textContent = `${unassigned.length} / ${state.castellers.length}`;
        }
